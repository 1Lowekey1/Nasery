# NaSeRy API on Apache (local demo server), instead of `php artisan serve`.
#
# Why: `artisan serve` answers one request at a time, and every page asks the
# API for several things at once. Apache answers them in parallel.
#
# This is a SEPARATE Apache process: XAMPP's own Apache, its httpd.conf and the
# default PHP 8.2 are untouched. It runs PHP 8.5.10 and listens on port 8000,
# the same address the frontend already uses.
#
# Start (from backend/):   C:\xampp\apache\bin\httpd.exe -f "%CD%\server\apache-local.conf"
# Stop:                    Ctrl+C in that window
# Other machine? Change the paths below (NASERY_ROOT and NASERY_WEB).
#
# Two sites in one Apache:
#   127.0.0.1:8000  the API alone (development: the Nuxt dev server calls it)
#   127.0.0.1:8080  PRODUCTION: the built website + /api on one address. The
#                   Cloudflare tunnel points here. Build/switch it with
#                   scripts\nasery-mode.ps1 (see that file).

Define XAMPP_APACHE "C:/xampp/apache"
Define NASERY_PHP   "C:/xampp/php8.5.10"
Define NASERY_ROOT  "C:/Users/natha/OneDrive/Desktop/NaSeRy/Dev/backend"
Define NASERY_WEB   "C:/Users/natha/OneDrive/Desktop/NaSeRy/Dev/frontend/.output/public"

ServerRoot "${XAMPP_APACHE}"
ServerName localhost
Listen 127.0.0.1:8000
Listen 127.0.0.1:8080
PidFile "${NASERY_ROOT}/storage/logs/apache.pid"

LoadModule access_compat_module modules/mod_access_compat.so
LoadModule alias_module modules/mod_alias.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule filter_module modules/mod_filter.so

# PHP 8.5.10 (thread-safe build) as an Apache module, with its own php.ini.
# Its extensions (curl, intl, pgsql, sodium) need these libraries. Apache does
# not search the PHP folder, and XAMPP's Apache ships older copies of some of
# them, so load PHP 8.5.10's own copies first, by full path.
LoadFile "${NASERY_PHP}/libcrypto-3-x64.dll"
LoadFile "${NASERY_PHP}/libssl-3-x64.dll"
LoadFile "${NASERY_PHP}/brotlicommon.dll"
LoadFile "${NASERY_PHP}/brotlidec.dll"
LoadFile "${NASERY_PHP}/nghttp2.dll"
LoadFile "${NASERY_PHP}/libssh2.dll"
LoadFile "${NASERY_PHP}/libsasl.dll"
LoadFile "${NASERY_PHP}/libpq.dll"
LoadFile "${NASERY_PHP}/libsodium.dll"
LoadFile "${NASERY_PHP}/icudt77.dll"
LoadFile "${NASERY_PHP}/icuuc77.dll"
LoadFile "${NASERY_PHP}/icuin77.dll"
LoadFile "${NASERY_PHP}/icuio77.dll"
LoadFile "${NASERY_PHP}/php8ts.dll"
LoadModule php_module "${NASERY_PHP}/php8apache2_4.dll"
PHPIniDir "${NASERY_PHP}"
# Web requests only (artisan/CLI keep php.ini): no error pages with file paths,
# no PHP version header, and no function arguments (passwords!) in stack traces.
php_admin_flag display_errors Off
php_admin_flag display_startup_errors Off
php_admin_flag log_errors On
php_admin_value error_log "${NASERY_ROOT}/storage/logs/php-error.log"
php_admin_flag expose_php Off
php_admin_flag zend.exception_ignore_args On
# Don't advertise the Apache version / OS either.
ServerTokens Prod
ServerSignature Off
AddHandler application/x-httpd-php .php

# Reuse Supabase connections between requests (see config/database.php).
# Each thread keeps at most one, so ThreadsPerChild caps the connections.
SetEnv DB_PERSISTENT true
# Rate-limit counters and cache in local files instead of Supabase (every
# request touches them). Sessions stay in the database: the signed-in devices
# list and "sign out everywhere" read them there.
SetEnv CACHE_STORE file
# While the frontend merge is in progress: the stable site runs on :3000 and
# the merge preview on :3001. Remove the :3001 entries when the merge is done.
SetEnv FRONTEND_URLS "http://localhost:3000,http://localhost:3001"
SetEnv SANCTUM_STATEFUL_DOMAINS "localhost:3000,127.0.0.1:3000,localhost:3001"

# Windows worker threads. Each thread keeps up to 2 database connections
# open (app + system).
# - Local PostgreSQL (database/local, since 2026-10-16): max_connections 100,
#   so 16 threads = at most 32, leaving room for the queue worker and artisan.
# - Supabase (free plan) allows only 15 clients: if you switch back to it
#   (backend/.env.supabase), set this to 6 and don't run DB commands while
#   Apache runs, or Supabase refuses with EMAXCONNSESSION.
<IfModule mpm_winnt_module>
    ThreadsPerChild 16
    MaxConnectionsPerChild 0
</IfModule>

TypesConfig conf/mime.types
DirectoryIndex index.php

LogFormat "%h %t \"%r\" %>s %b %D" timed
ErrorLog "${NASERY_ROOT}/storage/logs/apache-error.log"
CustomLog "${NASERY_ROOT}/storage/logs/apache-access.log" timed

DocumentRoot "${NASERY_ROOT}/public"
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "${NASERY_ROOT}/public">
    # Laravel's public/.htaccess sends every request to index.php.
    AllowOverride All
    Options FollowSymLinks
    Require all granted
</Directory>

# ---------------------------------------------------------------------------
# PRODUCTION site (127.0.0.1:8080): what the public sees through Cloudflare.
#   /                      the built website (static files; unknown paths get
#                          the app shell so Nuxt's router can show the page)
#   /api, /sanctum, /up    passed to Laravel on :8000 (same Apache), keeping
#                          the public Host header and Cloudflare's
#                          X-Forwarded-* headers (TRUSTED_PROXIES in .env)
# One address for both is what lets the sign-in cookie work without CORS.
# ---------------------------------------------------------------------------
<VirtualHost 127.0.0.1:8080>
    DocumentRoot "${NASERY_WEB}"
    <Directory "${NASERY_WEB}">
        AllowOverride None
        Options None
        Require all granted
    </Directory>
    # Every page address that isn't a real file gets the app shell (Nuxt's router
    # then shows the page). No folder redirects: Apache would build them with its
    # own address (http://…:8080/login/), which visitors can't reach.
    DirectorySlash Off
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/(api|sanctum|up)(/|$)
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteRule ^ /200.html [L]

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120
    ProxyPass        /api      http://127.0.0.1:8000/api
    ProxyPassReverse /api      http://127.0.0.1:8000/api
    ProxyPass        /sanctum  http://127.0.0.1:8000/sanctum
    ProxyPassReverse /sanctum  http://127.0.0.1:8000/sanctum
    ProxyPass        /up       http://127.0.0.1:8000/up
    ProxyPassReverse /up       http://127.0.0.1:8000/up

    # Built files have content hashes in their names: cache them for a year.
    # The app shell must always be fresh so a new release shows immediately.
    <LocationMatch "^/_nuxt/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/$|^/(index|200|404)\.html$">
        Header set Cache-Control "no-cache"
    </LocationMatch>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    # The full Content-Security-Policy (with the hashes of Nuxt's inline scripts)
    # is a <meta> tag in each page, added at build time by frontend/scripts/add-csp.mjs.
    # These are the parts a <meta> tag can't set; they also cover the API's responses.
    Header always set Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'"
    # HTTPS only from now on (the public address is always https via Cloudflare).
    Header always set Strict-Transport-Security "max-age=15552000"
    # The QR check-in page needs the camera; nothing needs mic, payment API or USB.
    Header always set Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=()"
    Header always unset X-Powered-By

    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml

    ErrorLog "${NASERY_ROOT}/storage/logs/apache-web-error.log"
    CustomLog "${NASERY_ROOT}/storage/logs/apache-web-access.log" timed
</VirtualHost>
